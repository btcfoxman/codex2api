name: Production Docker Deploy
permissions:
  contents: read
  packages: write
concurrency:
  group: production-codex2api
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: SSH-JP
    steps:
    - name: Activate the CI-verified image with its original entrypoint
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        port: ${{ secrets.DEPLOY_PORT || 22 }}
        command_timeout: 3m
        script_stop: true
        script: python3 -c 'import base64;exec(base64.b64decode(""))'
'on':
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options:
        - recover
        default: recover
