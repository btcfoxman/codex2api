name: Production Docker Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect without changing the server, or deploy after all verification
        type: choice
        options: [inspect, deploy]
        default: inspect

permissions:
  contents: read
  packages: write

concurrency:
  group: production-codex2api
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: SSH-JP
    steps:
      - uses: actions/checkout@v5
      - name: Encode the reviewed deployment program
        id: payload
        run: echo "script=$(base64 -w0 scripts/deploy_release.py)" >> "$GITHUB_OUTPUT"
      - name: Inspect or deploy the published image via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_COMPOSE_FILE: ${{ secrets.DEPLOY_COMPOSE_FILE || 'docker-compose.yml' }}
          DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE || 'codex2api' }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_IMAGE: ""
          DEPLOY_OPERATION: ${{ inputs.operation || 'deploy' }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          DEPLOY_PROGRAM: ${{ steps.payload.outputs.script }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 40m
          script_stop: true
          envs: DEPLOY_PATH,DEPLOY_COMPOSE_FILE,DEPLOY_SERVICE,RELEASE_SHA,RELEASE_IMAGE,DEPLOY_OPERATION,GHCR_USERNAME,GHCR_TOKEN,DEPLOY_PROGRAM
          script: |
            python3 -c 'import base64,os; exec(compile(base64.b64decode(os.environ["DEPLOY_PROGRAM"]), "deploy_release.py", "exec"))'

  verify:
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    uses: ./.github/workflows/pr-check.yml

  security:
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    uses: ./.github/workflows/security-scan.yml

  build-and-push:
    needs: [verify, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish verified images
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: SSH-JP
    steps:
      - uses: actions/checkout@v5
      - name: Encode the reviewed deployment program
        id: payload
        run: echo "script=$(base64 -w0 scripts/deploy_release.py)" >> "$GITHUB_OUTPUT"
      - name: Inspect or deploy the published image via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_COMPOSE_FILE: ${{ secrets.DEPLOY_COMPOSE_FILE || 'docker-compose.yml' }}
          DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE || 'codex2api' }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_IMAGE: ${{ needs.build-and-push.outputs.image }}
          DEPLOY_OPERATION: ${{ inputs.operation || 'deploy' }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          DEPLOY_PROGRAM: ${{ steps.payload.outputs.script }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 40m
          script_stop: true
          envs: DEPLOY_PATH,DEPLOY_COMPOSE_FILE,DEPLOY_SERVICE,RELEASE_SHA,RELEASE_IMAGE,DEPLOY_OPERATION,GHCR_USERNAME,GHCR_TOKEN,DEPLOY_PROGRAM
          script: |
            python3 -c 'import base64,os; exec(compile(base64.b64decode(os.environ["DEPLOY_PROGRAM"]), "deploy_release.py", "exec"))'
