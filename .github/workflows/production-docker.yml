name: Read-only activity classification
permissions:
  contents: read
  packages: read
concurrency:
  group: codex-readonly-activity-classification
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: SSH-JP
    steps:
    - name: Read counters and internal check metadata without prompts or credentials
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        port: ${{ secrets.DEPLOY_PORT || 22 }}
        script_stop: true
        command_timeout: 3m
        script: python3 -u -c 'import base64;exec(base64.b64decode(""))'
'on':
  workflow_dispatch: {}
