name: Deploy the verified release after natural idle
permissions:
  contents: read
  packages: read
concurrency:
  group: production-codex2api
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  wait-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: SSH-JP
    steps:
    - name: Keep intake open until work finishes, then deploy the verified immutable
        image
      uses: appleboy/ssh-action@v1.0.3
      env:
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        DEPLOY_COMPOSE_FILE: ${{ secrets.DEPLOY_COMPOSE_FILE || 'docker-compose.yml'
          }}
        DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE || 'codex2api' }}
        RELEASE_SHA: def3f01ca6fffe3115f82daa994c9aa25ef6525c
        RELEASE_IMAGE: ghcr.io/btcfoxman/codex2api@sha256:79f596afe68e9ebf91de44dea552ed546f65336ee39144731f2ecb6d14ade0eb
        GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
        GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
        CODEX_DEPLOY_COORDINATED_IDLE: '1'
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        port: ${{ secrets.DEPLOY_PORT || 22 }}
        command_timeout: 38m
        script_stop: true
        envs: DEPLOY_PATH,DEPLOY_COMPOSE_FILE,DEPLOY_SERVICE,RELEASE_SHA,RELEASE_IMAGE,GHCR_USERNAME,GHCR_TOKEN,CODEX_DEPLOY_COORDINATED_IDLE
        script: python3 -u -c 'import base64;exec(base64.b64decode(""))'
'on':
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options:
        - wait-release
        default: wait-release
